<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Dropdowns and Tooltips</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-top: 40px;
        }

        /* Menuja kryesore */
        nav {
            background-color: #333;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        nav ul li {
            position: relative;
        }

        nav ul li a {
            display: block;
            color: white;
            padding: 16px 25px;
            text-decoration: none;
        }

        nav ul li a:hover {
            background-color: #3498db;
        }

        /* Dropdown Menu */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 180px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: #333;
            padding: 12px 16px;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #ddd;
        }

        /* Shfaqja e dropdown */
        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Tooltip */
        .tooltip {
            position: relative;
            display: inline-block;
            margin-top: 50px;
            background-color: #3498db;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        .tooltip .tooltip-text {
            visibility: hidden;
            width: 180px;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;

            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);

            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Shfaqja e tooltip */
        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

    </style>
</head>

<body>

    <h1>CSS Dropdowns and Tooltips</h1>

    <nav>
        <ul>

            <li><a href="#">Ballina</a></li>

            <li class="dropdown">
                <a href="#">Shërbimet ▼</a>

                <div class="dropdown-content">
                    <a href="#">Dizajn Web</a>
                    <a href="#">Programim</a>
                    <a href="#">Marketing</a>
                </div>
            </li>

            <li class="dropdown">
                <a href="#">Produktet ▼</a>

                <div class="dropdown-content">
                    <a href="#">Laptopë</a>
                    <a href="#">Telefona</a>
                    <a href="#">Aksesorë</a>
                </div>
            </li>

            <li><a href="#">Kontakti</a></li>

        </ul>
    </nav>

    <div class="tooltip">
        Vendose miun këtu!

        <span class="tooltip-text">
            Ky është një informacion shtesë (Tooltip).
        </span>
    </div>

</body>
</html>
